name: Secret scope probe (temporary, security audit 2026-11-17)
# Prints only whether each secret NAME resolves to a non-empty value in this context.
# No value is ever echoed, written or used. Removed in the next commit.
on:
  push:
    branches: ['claude/zealous-dijkstra-c9vof5']
permissions:
  contents: read
jobs:
  repo_level:
    name: no environment (repository-level secrets only)
    runs-on: ubuntu-latest
    steps:
      - name: Report presence only
        env:
          A: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION != '' }}
          B: ${{ secrets.SUPABASE_URL_PRODUCTION != '' }}
          C: ${{ secrets.RESEND_API_KEY_WELCOME != '' }}
          D: ${{ secrets.WELCOME_POSTAL_ADDRESS != '' }}
          E: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_NONPROD != '' }}
          F: ${{ secrets.SUPABASE_URL_NONPROD != '' }}
        run: |
          for pair in "SUPABASE_SERVICE_ROLE_KEY_PRODUCTION:$A" "SUPABASE_URL_PRODUCTION:$B" "RESEND_API_KEY_WELCOME:$C" "WELCOME_POSTAL_ADDRESS:$D" "SUPABASE_SERVICE_ROLE_KEY_NONPROD:$E" "SUPABASE_URL_NONPROD:$F"; do
            name="${pair%%:*}"; v="${pair#*:}"
            if [ "$v" = "true" ]; then echo "$name: PRESENT at repository level"; else echo "$name: absent"; fi
          done
  production_env:
    name: environment production from a branch (expected refused)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "REACHED production environment from a non-main branch"
  nonprod_env:
    name: environment nonprod from a branch (expected refused)
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      - run: echo "REACHED nonprod environment from a non-main branch"
