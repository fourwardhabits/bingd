name: Release gate

# Everything ci.yml runs, plus the suites that are too slow or too heavy to put in
# front of every ordinary commit — and the checks that only matter when something is
# about to be handed to somebody else.
#
# Separate from ci.yml deliberately. The real multi-connection PostgreSQL concurrency
# suite starts an actual PostgreSQL 17 server and runs 74 tests across many connections;
# putting it on every pull request would make a one-line copy change cost several minutes
# and would teach people to stop watching CI. Putting it nowhere would mean the ranking
# and notification race invariants are only ever verified by the person who remembers to
# run them.
#
# So it runs here: before a Beta build, before an `eas update --branch beta`, and before
# anything is merged that a friend tester will end up running. See
# docs/release/safe-update-runbook.md §6.
#
# Started by hand rather than on a schedule, because "a release candidate" is a decision
# somebody makes rather than a state a branch drifts into. It also runs on any branch
# named release/*, which is where candidates are prepared.

on:
  workflow_dispatch:
  push:
    branches: ['release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full suite, real Postgres, export
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx expo customize tsconfig.json --non-interactive || true
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci

      # ---- Everything ci.yml runs -------------------------------------------------
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run test:db
      - run: npm run test:web
      - run: npm run test:web:mutants
      - run: npm run test:config
      - run: npm run functions:check
      - run: npm run functions:lint

      # push-sender, which this gate was not checking at all — `functions:check` and
      # `functions:lint` are tmdb-adapter's, by name, and the Deno half of ci.yml was never
      # copied here. So the workflow that stands between a commit and a store build was the
      # one place the function that sends people notifications went unverified.
      #
      # Spelled out rather than added as npm scripts for the reason ci.yml records:
      # `packageJson:scripts` is an @expo/fingerprint input, and a new script moves every
      # lane's runtime version including beta's.
      - run: npx deno check --config supabase/functions/push-sender/deno.json supabase/functions/push-sender/index.ts
      - run: npx deno lint --config supabase/functions/push-sender/deno.json supabase/functions/push-sender
      - run: npx deno test --config supabase/functions/push-sender/deno.json --allow-net supabase/functions/push-sender

      # ---- And the part that only runs here ---------------------------------------
      #
      # `test:race` is no longer *only* here: `db-races.yml` runs it on any pull request
      # that touches `supabase/migrations/**` or the concurrency suite, because a lock
      # deleted in a rebuild has to be caught before the merge rather than before the
      # build. It stays in this gate as well — a release candidate is checked whole,
      # whatever paths the branch happened to touch — and `test:race:mutants` remains
      # exclusive to this workflow.
      #
      # Real PostgreSQL, many connections. `embedded-postgres` downloads and starts a
      # genuine server, so these tests can interleave two transactions the way two
      # phones do — which is the only way the ranking, redemption and block-barrier
      # races can be observed at all. PGlite cannot express them: it is one connection.
      - name: Concurrency suite (real PostgreSQL)
        run: npm run test:race

      # And the check on that check: each race invariant is deliberately broken and the
      # suite is required to go red. A concurrency test that passes against a broken
      # implementation is worse than no concurrency test.
      - name: Concurrency mutation check
        run: npm run test:race:mutants

      # A bundle that cannot be produced is a build that cannot be made, and the failure
      # arrives ten minutes into an EAS build otherwise.
      - name: Android export
        run: npx expo export --platform android
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci
          APP_VARIANT: preview

      # The site build refuses on a missing or malformed identifier rather than
      # producing a file that makes every link open the browser. Cheap, and it is the
      # last thing between deep-links.config.json and Apple's CDN.
      - name: Site build
        run: npm run build:web

      # Each lane's config resolved with that lane's real variant, lane and backend, the
      # way an EAS build resolves it — and asserting that `extra.lane` and `extra.variant`
      # come back as the lane declared, which is the pair an `eas update` gets wrong when
      # it is run without `scripts/release.mjs`.
      #
      # Two earlier versions of this step were wrong and both were found by review rather
      # than by the step. The first set only APP_VARIANT and passed https://ci.invalid,
      # which is not a Supabase URL at all, so it asserted nothing about backends. The
      # second called itself "every lane" and skipped production in a `continue`.
      #
      # Named for what it does. It resolves **every lane that has a backend**, which today is
      # development, preview and beta, and becomes those three plus production the day a
      # production project exists. Review 28b caught the earlier version calling itself
      # "every lane" while skipping production in a `continue`; the negative steps below are
      # what cover a lane with no backend, and saying so is the difference between a skip and
      # a silent gap.
      - name: Every lane with a backend resolves against it
        run: |
          set -e
          node -e "
            const { execFileSync } = require('node:child_process');
            const { LANE_BACKENDS } = require('./config/backends.cjs');
            const eas = require('./eas.json');

            const withBackend = Object.entries(LANE_BACKENDS).filter(([, refs]) => refs.length);
            const without = Object.entries(LANE_BACKENDS).filter(([, refs]) => !refs.length);

            // Production is the only lane allowed to have no backend, and it is allowed to
            // *gain* one. An earlier version of this hard-failed the moment production got a
            // ref, on the reasoning that the change deserved a review touch — but the touch
            // it forced was to this file, in the middle of provisioning, which is the worst
            // moment to be editing a release gate. config/production-lane.test.mjs asserts
            // the ref, its name and its declared environment agree; that is the review.
            if (without.some(([lane]) => lane !== 'production')) {
              throw new Error(
                'Only the production lane may have no backend. Lanes without one: ' +
                  without.map(([l]) => l).join(', ')
              );
            }
            // Every template hole in this script is escaped, because the whole thing is
            // inside a double-quoted shell string — an unescaped one is a bash substitution
            // and not a JS template hole. The loop below has always escaped them; this line
            // did not, and bash answered "bad substitution" before node ever saw the file.
            console.log(
              LANE_BACKENDS.production.length
                ? \`production: \${LANE_BACKENDS.production.join(', ')}\`
                : 'production: no backend declared, covered by the negative step below'
            );

            for (const [lane, refs] of withBackend) {
              const variant = eas.build[lane].env.APP_VARIANT;
              for (const ref of refs) {
                const env = {
                  ...process.env,
                  EAS_BUILD: 'true',
                  BINGD_LANE: lane,
                  APP_VARIANT: variant,
                  EXPO_PUBLIC_SUPABASE_URL: \`https://\${ref}.supabase.co\`,
                  EXPO_PUBLIC_SUPABASE_ANON_KEY: 'ci',
                };
                const out = execFileSync('npx', ['expo', 'config', '--type', 'public', '--json'], {
                  env, encoding: 'utf8', shell: process.platform === 'win32',
                });
                const config = JSON.parse(out);
                if (config.extra.lane !== lane) throw new Error(lane + ': extra.lane is ' + config.extra.lane);
                if (config.extra.variant !== variant) throw new Error(lane + ': extra.variant is ' + config.extra.variant);
                console.log(\`--- \${lane}: \${config.android.package} on \${ref} — resolved\`);
              }
            }
          "

      # And the mirror image: a lane pointed at a project it may not use has to FAIL.
      # A check that only ever proves the good case proves that nothing throws.
      - name: A lane pointed at the wrong backend fails the build
        run: |
          set -e
          if EAS_BUILD=true BINGD_LANE=beta APP_VARIANT=production \
             EXPO_PUBLIC_SUPABASE_URL=https://someotherproject.supabase.co \
             EXPO_PUBLIC_SUPABASE_ANON_KEY=ci \
             npx expo config --type public --json > /dev/null 2>&1; then
            echo "The beta lane resolved against an unlisted Supabase project. The guard is inert."
            exit 1
          fi
          echo "beta + unlisted project: refused, as it must be"

          if EAS_BUILD=true BINGD_LANE=production APP_VARIANT=production \
             EXPO_PUBLIC_SUPABASE_URL=https://abheeqyjzekiowkztfxv.supabase.co \
             EXPO_PUBLIC_SUPABASE_ANON_KEY=ci \
             npx expo config --type public --json > /dev/null 2>&1; then
            echo "The production lane resolved against bingd-nonprod. The lane mapping is inert."
            exit 1
          fi
          echo "production + nonprod: refused, as it must be"

          # And the case the guard used to say nothing about, which is the state the
          # production EAS environment is actually in today: **no Supabase variables at all.**
          # `assertBackendIsAllowed` returns early on a URL it cannot parse as a Supabase
          # project — deliberately, for `https://ci.invalid` and for a local stack — and an
          # absent variable is not a Supabase URL either. So a production build with nothing
          # configured passed every check and would have failed as "Invalid app configuration"
          # on a phone, after a signed store build. config/production-lane.cjs closes it and
          # this is the proof the closure is wired in rather than merely written.
          if EAS_BUILD=true BINGD_LANE=production APP_VARIANT=production \
             EXPO_PUBLIC_SUPABASE_ANON_KEY=ci \
             npx expo config --type public --json > /dev/null 2>&1; then
            echo "The production lane resolved with no Supabase URL at all. The guard is inert."
            exit 1
          fi
          echo "production + no backend: refused, as it must be"

          # And the same bug one field along. A URL with no anon key builds, signs, submits,
          # and throws "Invalid app configuration" from src/lib/env.ts on a phone — the exact
          # failure the URL check exists to prevent. The two variables live in the same
          # dashboard and are forgotten together.
          if EAS_BUILD=true BINGD_LANE=production APP_VARIANT=production \
             EXPO_PUBLIC_SUPABASE_URL=https://someotherproject.supabase.co \
             npx expo config --type public --json > /dev/null 2>&1; then
            echo "The production lane resolved with no anon key. The guard is inert."
            exit 1
          fi
          echo "production + no anon key: refused, as it must be"

          # The control. Without it the three refusals above pass just as well against an
          # app.config.ts that throws for everything.
          if ! EAS_BUILD=true BINGD_LANE=beta APP_VARIANT=production \
             EXPO_PUBLIC_SUPABASE_URL=https://abheeqyjzekiowkztfxv.supabase.co \
             EXPO_PUBLIC_SUPABASE_ANON_KEY=ci \
             npx expo config --type public --json > /dev/null 2>&1; then
            echo "The beta lane no longer resolves against nonprod. Every refusal above is meaningless."
            exit 1
          fi
          echo "beta + nonprod: resolved, as it must"
