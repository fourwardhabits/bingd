name: Welcome email

# The founder's welcome note, sent once per new account about 48 hours after signup.
#
# ---------------------------------------------------------------------------
# SCHEDULED HOURLY AGAINST PRODUCTION SINCE 2026-09-18
# ---------------------------------------------------------------------------
#
# A scheduled run is always `send` on `production`: it has no inputs, so the
# expressions below name both explicitly rather than falling through to nonprod.
# A manual run keeps its inputs (default nonprod, dry-run). Either way, a send
# mails nobody until all of these are true in the target project:
#
#   1. supabase/migrations/20260923000100_a_welcome_note_sent_once.sql is applied to the target
#      (without it every RPC is a 404 and the worker stops).
#   2. copy.json has note.status APPROVED and a footer.postalAddress (the worker refuses
#      the cohort otherwise, before it claims anybody).
#   3. welcome.delivery_enabled is true AND welcome.start_after is a real date, in that
#      project's app_config (the claim returns nobody otherwise, inside SQL).
#
# The schedule was turned on in its own commit, after the founder confirmed Sign in with
# Apple private email relay for bingd.app (step 5 of emails/welcome/automation/README.md).
#
# Emergency stop, no deploy: `welcome.delivery_enabled` = false in production app_config.
# A disabled run claims nobody. Commenting the schedule out again stops the runs too.
#
# Why a GitHub Action rather than an Edge Function: nothing in the release path deploys
# supabase/functions/, and a welcome email running a fortnight-old template is that
# failure. What this runs is always what is on main. See the README.

on:
  schedule:
    - cron: '23 * * * *'   # hourly, off the hour
  workflow_dispatch:
    inputs:
      target:
        description: Which backend
        type: choice
        required: true
        default: nonprod
        options: [nonprod, production]
      mode:
        description: dry-run claims nobody and sends nothing
        type: choice
        required: true
        default: dry-run
        options: [dry-run, send]
      canary_user:
        description: Canary only. The test account's user id. Leave empty for the cohort.
        type: string
        required: false
      canary_email:
        description: Canary only. That account's confirmed address, which must be on welcome.canary_addresses.
        type: string
        required: false

# Two runs never overlap. The claim is safe under overlap anyway (see the race suite);
# this keeps the logs readable.
concurrency:
  group: welcome-email-${{ github.event_name == 'schedule' && 'production' || github.event.inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    name: ${{ github.event_name == 'schedule' && 'send' || github.event.inputs.mode }} on ${{ github.event_name == 'schedule' && 'production' || github.event.inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The message as a reader receives it. A link or an instruction that no longer
      # matches the app stops the run before a single claim.
      - run: node --test emails/welcome/email.test.mjs

      - name: Run the worker
        env:
          SUPABASE_URL: ${{ (github.event_name == 'schedule' || github.event.inputs.target == 'production') && secrets.SUPABASE_URL_PRODUCTION || secrets.SUPABASE_URL_NONPROD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ (github.event_name == 'schedule' || github.event.inputs.target == 'production') && secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION || secrets.SUPABASE_SERVICE_ROLE_KEY_NONPROD }}
          # A key of its own, sending access restricted to bingd.app. Never the key named
          # Supabase, which relays every sign-in code.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_WELCOME }}
          # The physical mailing address a commercial email has to carry. A repository
          # secret rather than a line in copy.json, because it is the operator home
          # address and a committed value is in git history for ever. The worker refuses,
          # before claiming anybody, when it is missing, blank or placeholder-shaped, so a
          # forgotten secret costs nobody their one chance at the note.
          WELCOME_POSTAL_ADDRESS: ${{ secrets.WELCOME_POSTAL_ADDRESS }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || github.event.inputs.mode }}
          CANARY_USER: ${{ github.event.inputs.canary_user }}
          CANARY_EMAIL: ${{ github.event.inputs.canary_email }}
        run: |
          set -euo pipefail
          args=()
          if [ "$MODE" = "dry-run" ]; then args+=(--dry-run); fi
          if [ -n "$CANARY_USER" ] || [ -n "$CANARY_EMAIL" ]; then
            args+=(--canary "$CANARY_USER" --canary-email "$CANARY_EMAIL")
          fi
          node emails/welcome/automation/send-welcome.mjs "${args[@]}"
