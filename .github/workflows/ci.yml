name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Expo Router generates route types; typecheck depends on them.
      - run: npx expo customize tsconfig.json --non-interactive || true
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --ci

      # Migrations and RPCs run against real Postgres compiled to WebAssembly,
      # so the schema and the ranking invariants are verified without Docker.
      - run: npm run test:db

      # Edge Functions are Deno and are excluded from tsconfig and eslint, so the
      # steps above cannot see them at all. Without this, tmdb-adapter is checked by
      # nothing until a deploy fails. Deno is a devDependency rather than a setup
      # action so these two commands behave the same here as on a developer machine.
      - run: npm run functions:check

      - run: npm run functions:lint
