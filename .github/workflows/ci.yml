name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Expo Router generates route types; typecheck depends on them.
      - run: npx expo customize tsconfig.json --non-interactive || true
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.invalid
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test -- --ci

      # Migrations and RPCs run against real Postgres compiled to WebAssembly,
      # so the schema and the ranking invariants are verified without Docker.
      - run: npm run test:db

      # bingd.app is built from this branch by Cloudflare Pages on every push to main,
      # so this is the last gate before the site people reach from an invitation
      # changes. Nothing above sees web/ at all: it is plain .mjs, outside tsconfig,
      # and its build is a separate script. `test:web` runs that build as part of its
      # setup, so a build that would fail on Pages fails here first — with the failure
      # attached to the commit rather than to a deploy nobody was watching.
      - run: npm run test:web

      # And the check on that check. A deep link is a claim made in app.config.ts,
      # deep-links.config.json, the .well-known files and the Expo Router tree, with no
      # compiler between them; `/list/*` was claimed against app/lists/[id].tsx for
      # weeks with every test green. Each way those four can drift is reintroduced here
      # and required to go red.
      - run: npm run test:web:mutants

      # The release lanes. Cheap, static, and in the *pull request* gate deliberately:
      # what it protects is every change to eas.json and config/backends.cjs, and those
      # arrive on ordinary pull requests rather than on release branches. Independent
      # review 28 made this point — a lane assertion that only runs at release time is a
      # lane assertion that runs after the mistake has been merged.
      #
      # It asserts the lane-to-backend mapping directly (URL parsing, cross-lane swaps,
      # the empty production lane, the local escape hatch) and that eas.json's four
      # profiles each declare their own lane, a real EAS environment and a distinct
      # channel.
      - run: npm run test:config

      # Edge Functions are Deno and are excluded from tsconfig and eslint, so the
      # steps above cannot see them at all. Without this, tmdb-adapter is checked by
      # nothing until a deploy fails. Deno is a devDependency rather than a setup
      # action so these two commands behave the same here as on a developer machine.
      - run: npm run functions:check

      - run: npm run functions:lint

      # push-sender, checked the same way and for the same reason the comment above
      # gives — otherwise it is checked by nothing until a deploy fails, and it is the
      # one function that can send somebody a notification.
      #
      # **Spelled out here rather than added as npm scripts, deliberately.**
      # `packageJson:scripts` is an @expo/fingerprint input: adding a script moves the
      # runtime version of every lane, and the published friend-beta binary is pinned to
      # its fingerprint. A new script here would stop that binary receiving over-the-air
      # updates — silently, and with a redistribution as the only fix. Three lines of
      # duplication is the cheaper side of that trade. See config/push.cjs.
      - run: npx deno check --config supabase/functions/push-sender/deno.json supabase/functions/push-sender/index.ts

      - run: npx deno lint --config supabase/functions/push-sender/deno.json supabase/functions/push-sender

      - run: npx deno test --config supabase/functions/push-sender/deno.json --allow-net supabase/functions/push-sender
