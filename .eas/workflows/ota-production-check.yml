# Answers "can this commit go over the air?" and publishes nothing: it has no update job, and
# `config/ota-workflows.test.mjs` fails if one is added.
#
#   eas workflow:run .eas/workflows/ota-production-check.yml --ref <full sha> --non-interactive --wait
#
# Compare its two hashes with `config/live-runtimes.json`. Any difference means the commit needs
# a binary, not an update. Resolves the lane exactly as ota-production.yml does.

name: OTA production check

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    type: fingerprint
    environment: production
    env:
      APP_VARIANT: production
      BINGD_LANE: production
