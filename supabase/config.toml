project_id = "bingd"

# ---------------------------------------------------------------------------
# Edge Functions
#
# This file exists for this block. Everything else the CLI needs it already had:
# the linked project ref lives in supabase/.temp, and `db push` has never read a
# config. Per-function settings have nowhere else to go.
# ---------------------------------------------------------------------------

[functions.tmdb-adapter]
# The platform rejects a request with no valid JWT before the function starts, so
# an unauthenticated caller never reaches the provider quota. It is not sufficient
# on its own — the anon key is itself a valid JWT — which is why index.ts resolves
# the caller to a real user or to service_role before doing any work.
#
# DO NOT SET THIS TO FALSE without reading resolveCaller in index.ts. The two
# maintenance actions recognise service_role from the `role` claim, and they trust
# that claim precisely because this flag means the signature was already verified
# against the project's JWT secret. Turning it off leaves user search working and
# makes `enrich` and `refresh` forgeable, which is the worst shape a regression can
# have: invisible, and only in the privileged path.
verify_jwt = true

[functions.push-sender]
# Same flag and the same coupling as above, and the same warning: `index.ts` recognises
# `service_role` from the `role` claim without verifying a signature, and it may only do
# that because the platform has already verified one.
#
# The gate is deliberately weak beyond that — any signed-in account may invoke this
# function, because invoking it chooses nothing. It takes no recipient, no copy and no
# batch size; everything sent is read from `push_outbox`, whose primary key is a
# notification id. What an invocation *is* is a nudge that there may be work, and the
# reason a client is allowed to give one is that the person who caused a notification is
# holding a phone at that moment.
#
# The anon key is itself a valid JWT, which is why `verify_jwt` is not sufficient on its
# own here either: `resolveCaller` resolves the token to a real user or to service_role
# before anything is claimed.
verify_jwt = true

[functions.letterboxd-import]
# Same flag and the same coupling as the two above: `index.ts` recognises `service_role`
# from the `role` claim without verifying a signature, and it may only do that because the
# platform has already verified one. **Do not set this to false.**
#
# Unlike `push-sender`, the gate here is NOT deliberately weak. An invocation chooses
# real work — it claims rows from `import_rows`, spends provider requests against them and
# writes `media_items` and `letterboxd_matches`, the last of which is shared across every
# account. So `index.ts` refuses anything that is not the service role outright, and the
# only caller is `_drain_import_jobs` posting with the key from the vault.
verify_jwt = true

[functions.username-sign-in]
# NOT DEPLOYED (2026-11-13): groundwork behind the client constant
# USERNAME_SIGN_IN_ENABLED = false. See docs/architecture/username-sign-in.md.
#
# Called *before* there is a session, with the anon key, so this flag proves only that the
# caller holds the anon key — and that is all it is for: it keeps traffic that does not even
# have the app's public key off the function before it starts. Unlike the three functions
# above, `index.ts` trusts **no** claim from the token: it never reads a role or a subject,
# and every privileged step uses the service role key the platform injects. Setting this to
# false would make nothing forgeable; it would only widen who can spend the per-IP budgets.
# Leave it true.
verify_jwt = true
