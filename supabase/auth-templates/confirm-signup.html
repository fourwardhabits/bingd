<!--
  Confirm signup. The template Supabase sends to an address with no account yet, which is
  every friend-beta tester on their first launch — and the one that was actually sending
  the link the tester reported. Same code, same words as magic-link.html: a product where
  new users and returning users get different sign-in mechanics is a product whose
  sign-in only the second group can test.

  There is deliberately no link of any kind in this email. See ./README.md.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f6;padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#ffffff;border-radius:14px;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
        <tr>
          <td style="font-size:22px;font-weight:600;color:#1a1a1a;padding-bottom:20px;">bingd.</td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:22px;color:#4a4a4a;padding-bottom:20px;">
            Your sign-in code is:
          </td>
        </tr>
        <tr>
          <td style="font-size:32px;font-weight:600;letter-spacing:6px;color:#773744;padding-bottom:20px;">
            {{ .Token }}
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:20px;color:#767676;">
            Enter it in the app. It expires in 10 minutes.
            <br /><br />
            If you didn't ask for this code, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
