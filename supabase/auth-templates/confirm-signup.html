<!--
  Confirm signup. The template Supabase sends to an address with no account yet.

  Since the founder's 2026-08-26 password-first amendment this is the **account
  verification** email rather than a sign-in one: it arrives because somebody chose an
  email and a password on the Create account screen, and the code finishes creating the
  account rather than logging anybody in. The wording follows, which is why it is no
  longer identical to magic-link.html — that one is still a sign-in code.

  What has not changed is the mechanic. There is deliberately no link of any kind in this
  email: `verifySignUpCode` calls `verifyOtp({ type: 'signup' })` and the session is
  established inside Bingd. A confirmation URL here would complete the sign-in in a
  browser and produce a session the app never sees, which is exactly what a friend-beta
  tester reported. The shape check forbids one by name, so this comment cannot spell it.
  See ./README.md.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf8f6;padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;background:#ffffff;border-radius:14px;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
        <tr>
          <td style="font-size:22px;font-weight:600;color:#1a1a1a;padding-bottom:20px;">bingd.</td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:22px;color:#4a4a4a;padding-bottom:20px;">
            Your verification code is:
          </td>
        </tr>
        <tr>
          <td style="font-size:32px;font-weight:600;letter-spacing:6px;color:#773744;padding-bottom:20px;">
            {{ .Token }}
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:20px;color:#767676;">
            Enter this code in the app to finish creating your account. It expires in 10 minutes.
            <br /><br />
            If you didn't create a bingd. account, you can ignore this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
