<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bingd</title>
    <meta name="description" content="Rank what you have watched, and see what your friends really think." />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Values copied from src/ui/tokens/color.ts. The app is the source of truth;
         this page is one screen and does not justify a build step to share them. */
      :root {
        --parchment: #f5ebdd;
        --raised: #fcf6ec;
        --maroon: #773744;
        --ink: #242326;
        --secondary: #5f5a56;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.5rem;
        background: var(--parchment);
        color: var(--ink);
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 32rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: clamp(2.75rem, 12vw, 4.5rem);
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--maroon);
      }

      .tagline {
        margin: 0 0 2.5rem;
        font-family: 'DM Serif Display', Georgia, serif;
        font-style: italic;
        font-size: clamp(1.1rem, 4.5vw, 1.4rem);
        line-height: 1.4;
        color: var(--ink);
      }

      .card {
        background: var(--raised);
        border: 1px solid rgba(36, 35, 38, 0.08);
        border-radius: 0.75rem;
        padding: 1.5rem;
        box-shadow: 0 1px 2px rgba(36, 35, 38, 0.06);
      }

      p {
        margin: 0;
        font-size: 0.975rem;
        line-height: 1.6;
        color: var(--secondary);
      }

      footer {
        margin-top: 2.5rem;
        font-size: 0.8125rem;
        color: var(--secondary);
      }

      a {
        color: var(--maroon);
        text-decoration-thickness: 1px;
        text-underline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Bingd</h1>
      <p class="tagline">Rank what you&rsquo;ve watched. See what your friends really think.</p>

      <div class="card">
        <p>
          Bingd is in closed testing. Invitations are going out to a small first group, and
          this page will become the app&rsquo;s public face when it opens up.
        </p>
      </div>

      <footer>
        <a href="mailto:hello@bingd.app">hello@bingd.app</a>
      </footer>
    </main>
  </body>
</html>
