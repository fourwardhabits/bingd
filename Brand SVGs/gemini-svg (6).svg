<svg viewBox="0 0 200 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap');
    .text { font-family: 'DM Serif Display', serif; font-size: 48px; fill: #19242D; text-anchor: middle; }
  </style>
  
  <g stroke="#773744" stroke-width="8" stroke-linecap="butt" stroke-linejoin="round" fill="none">
    <!-- Amber Intersection Fill -->
    <rect x="80" y="45" width="40" height="50" rx="4" fill="#D4A64C" stroke="none" />

    <!-- Left Film Frame -->
    <rect x="20" y="15" width="100" height="80" rx="10" />
    <line x1="45" y1="15" x2="45" y2="95" />
    <line x1="20" y1="35" x2="45" y2="35" />
    <line x1="20" y1="55" x2="45" y2="55" />
    <line x1="20" y1="75" x2="45" y2="75" />

    <!-- Right Film Frame -->
    <rect x="80" y="45" width="100" height="80" rx="10" />
    <line x1="155" y1="45" x2="155" y2="125" />
    <line x1="155" y1="65" x2="180" y2="65" />
    <line x1="155" y1="85" x2="180" y2="85" />
    <line x1="155" y1="105" x2="180" y2="105" />
  </g>
  
  <!-- Text -->
  <text x="100" y="178" class="text">bingd.</text>
</svg>
